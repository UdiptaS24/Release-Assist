name: Release Assist Pipeline

on:
  workflow_call:

jobs:
  run-pipeline:
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      RELEASE_API_URL: http://127.0.0.1:8000/releases
      INTERNAL_PATTERNS: -service,-api,-worker,-gateway,-client
      GEMINI_MODEL: gemini-3.1-flash-lite
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    if: contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4

      - name: Checkout Release Assist engine
        uses: actions/checkout@v4
        with:
          repository: UdiptaS24/Release-Assist
          path: release-assist

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
        
      - run: pip install -r release-assist/requirements.txt
      - run: pip install pyyaml jq

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget

          wget -qO- https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin

          trivy --version

      - name: Get PR description
        run: |
          echo '${{ github.event.pull_request.body }}' > pr_body.txt

      - name: Parse PR description
        run: |
          python <<EOF
          import yaml
          import sys

          def fail(msg):
              print(f"[ERROR] {msg}")
              sys.exit(1)

          with open("pr_body.txt") as f:
              try:
                  data = yaml.safe_load(f.read()) or {}
              except Exception:
                  fail("PR description is not valid YAML")
          
          if not isinstance(data, dict):
              fail("PR description must be a YAML object")
          
          release = data.get("release", {})
          deployment = data.get("deployment", {})
          notify = data.get("notify", [])

          if not release:
              fail("Missing 'release' section in PR")
          
          required_release_fields = [
              "app_name", "version", "release_type", "contact_email", "rollback_plan"
          ]

          
          for field in required_release_fields:
              if not release.get(field):
                  fail(f"Missing release.{field}")

          
          if not deployment:
              fail("Missing 'deployment' section")

          for field in ["start", "end"]:
              if not deployment.get(field):
                  fail(f"Missing deployment.{field}")
          
          if not isinstance(notify, list) or not notify:
              fail("'notify' must be a non-empty list")

          for email in notify:
              if not isinstance(email, str) or "@" not in email:
                  fail(f"Invalid email in notify: {email}")

          def safe(val):
              return "" if val is None else str(val)
          
          with open("release_env.sh", "w") as f:         
              f.write(f"APP_NAME='{safe(release.get('app_name'))}'\n")
              f.write(f"VERSION='{safe(release.get('version'))}'\n")
              f.write(f"RELEASE_TYPE='{safe(release.get('release_type'))}'\n")
              f.write(f"EMAIL='{safe(release.get('contact_email'))}'\n")
              f.write(f"ROLLBACK='{safe(release.get('rollback_plan'))}'\n")
              f.write(f"START='{safe(deployment.get('start'))}'\n")
              f.write(f"END='{safe(deployment.get('end'))}'\n")
              f.write(f"NOTIFY='{safe(','.join(notify))}'\n")
          
          print("PR input validation passed")
          EOF
      
      
      - name: Handle validation failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "**Release Assist Error:** Invalid PR description format. Please follow the required YAML schema."
            });

      - name: Start Release Assist API
        run: |
          cd release-assist
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          sleep 5

      - name: Set API URL
        run: echo "API_URL=http://127.0.0.1:8000/releases" >> $GITHUB_ENV
      
      - name: Submit release
        run: |      
          source release_env.sh

          CMD="python release-assist/cli/release_agent.py submit \
            --app-name \"$APP_NAME\" \
            --version \"$VERSION\" \
            --release-type \"$RELEASE_TYPE\" \
            --email \"$EMAIL\" \
            --repo-url \"https://github.com/${{ github.repository }}.git\" \
            --rollback-plan \"$ROLLBACK\" \
            --start \"$START\" \
            --end \"$END\""
            
            IFS=',' read -ra EMAILS <<< "$NOTIFY"
            for e in "${EMAILS[@]}"; do
              if [ -n "$e" ]; then
                CMD="$CMD --notify \"$e\""
              fi
            done

            eval "$CMD --json > submit_output.json"

      - name: Debug submit output
        run: |
          cat submit_output.json

      - name: Extract release ID
        run: |
          echo "RELEASE_ID=$(jq -r '.id' submit_output.json)" >> $GITHUB_ENV

      - name: Run pipeline
        run : |
          python release-assist/cli/release_agent.py run $RELEASE_ID --json > output.json

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('output.json', 'utf8'));

            const status = data.status || "UNKNOWN";
            const pipeline = data.pipeline_status || "UNKNOWN";

            const validation = data.validation_report || {};
            const quality = validation.quality_check || {};
            const vulnerabilities = validation.vulnerability_scan || {};
            const dependencies = validation.dependencies || {};
            const risk = validation.risk_report || {};
            const assessment = risk.assessment || {};
            const gate = validation.gate_decision || {};
            const snapshot = data.change_snapshot || {};
            const scheduleData = data.schedule || {};
            const pipelineLog = data.pipeline_log || [];

            function statusIcon(value) {
              const v = String(value || "").toUpperCase();

              if (["SUCCESS", "APPROVED", "SCHEDULED", "COMPLETED", "GO"].includes(v)) {
                return "✅";
              }

              if (["WARNING", "NEEDS_REVIEW", "SUGGESTED_ALTERNATE", "SKIPPED"].includes(v)) {
                return "⚠️";
              }

              if (["ERROR", "FAILED", "BLOCKED", "HARD_BLOCK", "NO_GO", "STOPPED"].includes(v)) {
                return "❌";
              }

              return "ℹ️";
            }

            function safe(value, fallback = "N/A") {
              return value === undefined || value === null || value === "" ? fallback : value;
            }

            function renderPipelineLog(logs) {
              if (!logs.length) {
                return "_No pipeline log entries found._";
              }

              const rows = logs.map(entry => {
                return `| ${safe(entry.step)} | ${statusIcon(entry.status)} ${safe(entry.status)} | ${safe(entry.message, "-")} | ${safe(entry.reason, "-")} | ${safe(entry.timestamp, "-")} |`;
              }).join("\n");

              return `
            | Step | Status | Message | Reason | Timestamp |
            |---|---|---|---|---|
            ${rows}
            `;
            }

            function renderTopRisks(risks) {
              if (!risks || risks.length === 0) {
                return "✅ No major risks detected.";
              }

              return risks.map((risk, index) => {
                return `${index + 1}. **[${safe(risk.severity)}] ${safe(risk.title)}**  
              - ${safe(risk.description, "No description provided.")}  
              - Suggested fix: ${safe(risk.suggested_fix, "N/A")}`;
              }).join("\n\n");
            }

            function renderPositiveSignals(signals) {
              if (!signals || signals.length === 0) {
                return "_No positive signals reported._";
              }

              return signals.map(signal => `- ${signal}`).join("\n");
            }

            function renderConflicts(conflicts) {
              if (!conflicts || conflicts.length === 0) {
                return "✅ No scheduling conflicts detected.";
              }

              return conflicts.map(conflict => {
                return `- **${safe(conflict.name, safe(conflict.type))}**: ${safe(conflict.reason)}`;
              }).join("\n");
            }

            function renderScheduleAction(scheduleData) {
              const scheduleStatus = scheduleData.status;

              if (scheduleStatus === "SCHEDULED") {
                return "✅ Requested deployment window accepted. Proceed with the merge/deployment process at the scheduled window.";
              }

              if (scheduleStatus === "SUGGESTED_ALTERNATE") {
                return `⚠️ Requested deployment window conflicts with the deployment calendar.  
            Please update the PR description with the suggested deployment window and re-run the workflow by re-applying the \`release\` label.`;
              }

              if (scheduleStatus === "BLOCKED") {
                return "❌ Deployment scheduling is blocked. Resolve the gate/scheduling issue before re-running.";
              }

              return "N/A";
            }

            const vulnCounts = vulnerabilities.severity_counts || {};
            const vulnSummary = Object.keys(vulnCounts).length
              ? `CRITICAL: ${vulnCounts.CRITICAL || 0} | HIGH: ${vulnCounts.HIGH || 0} | MEDIUM: ${vulnCounts.MEDIUM || 0} | LOW: ${vulnCounts.LOW || 0}`
              : safe(vulnerabilities.error || vulnerabilities.message, "N/A");

            const depFlags = dependencies.flags || {};
            const snapshotSummary = snapshot.summary || {};
            const envVars = snapshot.new_env_vars_detected || {};
            const scheduleConflicts = scheduleData.conflicts || [];

            const comment = `
            ## Release Assist Report

            ### Pipeline Summary
            - **Pipeline Status**: ${statusIcon(pipeline)} ${pipeline}
            - **Final Release Status**: ${statusIcon(status)} ${status}

            ---

            ### Agentic Pipeline Execution Log

            ${renderPipelineLog(pipelineLog)}

            ---

            ### Quality Check
            - **Status**: ${statusIcon(quality.status)} ${safe(quality.status)}
            - **Quality Score**: ${safe(quality.quality_score)}
            - **Total Issues**: ${safe(quality.total_issues)}
            - **Reason / Message**: ${safe(quality.message, "-")}

            ---

            ### Vulnerability Scan
            - **Status**: ${statusIcon(vulnerabilities.status)} ${safe(vulnerabilities.status)}
            - **Severity Summary**: ${vulnSummary}
            - **Reason / Error**: ${safe(vulnerabilities.error || vulnerabilities.reason, "-")}

            ---

            ### Dependencies
            - **Status**: ${statusIcon(dependencies.status)} ${safe(dependencies.status)}
            - **Upstream Packages**: ${safe(dependencies.upstream?.total, 0)}
            - **Downstream Services**: ${safe(dependencies.downstream?.total, 0)}
            - **Errors**: ${safe(depFlags.errors, 0)}
            - **Warnings**: ${safe(depFlags.warnings, 0)}
            - **Reason**: ${safe(dependencies.reason, "-")}

            ---

            ### Risk Assessment
            - **Status**: ${statusIcon(risk.status)} ${safe(risk.status)}
            - **Source**: ${safe(risk.source)}
            - **Recommendation**: ${statusIcon(assessment.recommendation)} ${safe(assessment.recommendation)}
            - **Confidence**: ${safe(assessment.confidence)}
            - **Summary**: ${safe(assessment.summary)}

            #### Top Risks
            ${renderTopRisks(assessment.top_risks)}

            #### Positive Signals
            ${renderPositiveSignals(assessment.positive_signals)}

            ---

            ### Change Snapshot
            - **Status**: ${statusIcon(snapshot.status)} ${safe(snapshot.status)}
            - **Current Version**: ${safe(snapshot.current_version)}
            - **Previous Version**: ${safe(snapshot.previous_version)}
            - **Files Changed**: ${safe(snapshotSummary.total_files_changed, 0)}
            - **Added**: ${safe(snapshotSummary.added, 0)}
            - **Modified**: ${safe(snapshotSummary.modified, 0)}
            - **Deleted**: ${safe(snapshotSummary.deleted, 0)}
            - **Renamed**: ${safe(snapshotSummary.renamed, 0)}
            - **New Env Vars**: ${(envVars.added || []).length ? envVars.added.join(", ") : "None"}
            - **Removed Env Vars**: ${(envVars.removed || []).length ? envVars.removed.join(", ") : "None"}
            - **Reason**: ${safe(snapshot.reason, "-")}

            ---

            ### Gate Decision
            - **Outcome**: ${statusIcon(gate.outcome)} ${safe(gate.outcome)}
            - **Reason**: ${safe(gate.reason)}
            - **Decision Source**: ${safe(gate.decision_source)}
            - **Severity**: ${safe(gate.severity)}
            - **Auto Decided**: ${safe(gate.auto_decided)}

            #### Contributing Factors
            ${
              gate.contributing_factors && gate.contributing_factors.length
                ? gate.contributing_factors.map(factor => `- ${factor}`).join("\n")
                : "_No contributing factors reported._"
            }

            ---

            ### Deployment Scheduling
            - **Status**: ${statusIcon(scheduleData.status)} ${safe(scheduleData.status)}
            - **Requested Window**: ${safe(scheduleData.requested_start)} → ${safe(scheduleData.requested_end)}
            - **Scheduled Window**: ${safe(scheduleData.scheduled_start)} → ${safe(scheduleData.scheduled_end)}
            - **Reason**: ${safe(scheduleData.reason)}

            #### Scheduling Conflicts
            ${renderConflicts(scheduleConflicts)}

            #### Scheduling Action
            ${renderScheduleAction(scheduleData)}

            ---

            ### Final Status
            **${statusIcon(status)} ${status}**

            ---

            ### Raw Output for Debugging
            <details>
            <summary>Expand full JSON</summary>

            \`\`\`json
            ${JSON.stringify(data, null, 2)}
            \`\`\`

            </details>
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });